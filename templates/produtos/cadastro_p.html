<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Produto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <h1>Novo Produto</h1>

    <div class="card">
        <form method="POST">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Nome do produto" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Descrição do produto"></textarea>

            <label for="preco">Preço</label>
            <input type="number" id="preco" name="preco" step="0.01" placeholder="0,00" required>

            <label>
                <input type="checkbox" name="tamanhos">
                Possui tamanhos
            </label>

            <label>
                <input type="checkbox" name="estoque">
                Controla estoque
            </label>

            <button type="submit">Cadastrar</button>

        </form>
    </div>
</div>

</body>
</html>
