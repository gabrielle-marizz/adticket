<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <h1>Editar Produto</h1>

    <form method="POST">

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" value="{{ produto.nome }}" placeholder="Nome do produto" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" placeholder="Descrição do produto">{{ produto.descricao }}</textarea>

        <label for="preco">Preço</label>
        <input type="number" id="preco" name="preco" step="0.01" value="{{ produto.preco }}" placeholder="0,00" required>

        <label>
            <input type="checkbox" name="tamanhos" {% if produto.possui_tamanhos %}checked{% endif %}>
            Possui tamanhos
        </label>

        <label>
            <input type="checkbox" name="estoque" {% if produto.controla_estoque %}checked{% endif %}>
            Controla estoque
        </label>

        <button type="submit">Salvar</button>

    </form>
</div>

</body>
</html>
